
name: PS4 Native Scanner Build (Experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - "ps4-auto-updater-v0.3/**"
      - ".github/workflows/ps4-build.yml"

permissions:
  contents: read

jobs:

  host-tests:
    name: PC Simulation Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check original scanner
        run: |
          mkdir -p ps4-auto-updater-v0.3/ps4/build

          cc -std=c99 -Wall -Wextra -Werror -O2 \
            -o ps4-auto-updater-v0.3/ps4/build/scanner-host \
            ps4-auto-updater-v0.3/ps4/src/main.c

          python3 ps4-auto-updater-v0.3/tests/test_ps4_scanner.py

      - name: Test installed game checker with mock PS4
        run: |
          python3 ps4-auto-updater-v0.3/tests/test_installed_mock.py

      - name: Host checks completed
        run: |
          echo "Host tests completed."
          echo "This does not confirm real PS4 compatibility."

  ps4-scanner:
    name: Build PS4 Package
    runs-on: ubuntu-22.04

    needs:
      - host-tests

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            make \
            curl \
            ca-certificates \
            python3 \
            libicu-dev

      - name: Download OpenOrbis Toolchain
        run: |
          curl -fL --retry 3 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o /tmp/openorbis.tar.gz

          mkdir -p "$RUNNER_TEMP/openorbis"

          tar -xzf /tmp/openorbis.tar.gz \
            -C "$RUNNER_TEMP/openorbis"

          SDK_LINK=$(find "$RUNNER_TEMP/openorbis" \
            -name link.x -type f -print -quit)

          test -n "$SDK_LINK"

          SDK_ROOT=$(dirname "$SDK_LINK")

          echo "OO_PS4_TOOLCHAIN=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Compile PS4 Package
        run: |
          make -C ps4-auto-updater-v0.3/ps4

      - name: Upload PS4 Package
        uses: actions/upload-artifact@v4
        with:
          name: ps4-scanner-experimental
          path: ps4-auto-updater-v0.3/ps4/*.pkg
          if-no-files-found: error
          retention-days: 14
