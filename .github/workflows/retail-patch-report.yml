name: PS4 Retail Patch Metadata Report

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    paths:
      - ".github/workflows/retail-patch-report.yml"

permissions:
  contents: write

concurrency:
  group: ps4-public-retail-report
  cancel-in-progress: false

jobs:
  retail-report:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Test retail metadata parser offline
        run: |
          python3 -m unittest discover \
            -s ps4-auto-updater-v0.3/tests \
            -p 'test_official_patch_lookup.py' \
            -v

      - name: Fetch metadata and prepare public read-only files
        env:
          PYTHONPATH: ps4-auto-updater-v0.3
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          from official_patch_lookup import discover

          # Already listed in this public workflow. Historical data only.
          # Do not publish the original console inventory or Content IDs.
          snapshot = [
              ("CUSA00001", "THE PLAYROOM", "01.07"),
              ("CUSA06122", "Roblox", "02.62"),
              ("CUSA57220", "EA SPORTS FC 27", "01.07"),
              ("CUSA03506", "Grand Theft Auto: San Andreas", "01.00"),
              ("CUSA01116", "YouTube", "02.39"),
              ("CUSA08032", "Dead by Daylight", "03.83"),
              ("CUSA00411", "Grand Theft Auto V", "01.57"),
              ("CUSA03551", "Canis Canem Edit", "01.00"),
              ("CUSA02343", "Uncharted: The Nathan Drake Collection", "01.00"),
          ]
          raw = discover([item[0] for item in snapshot])
          counts = Counter(item["status"] for item in raw["titles"])
          if counts["LOOKUP_FAILED"] == len(snapshot):
              raise SystemExit("All retail lookups failed; keeping last published data")

          generated = datetime.now(timezone.utc).isoformat()
          names = {cusa: (name, ver) for cusa, name, ver in snapshot}

          # Safe public data: no Sony metadata URL, no console Content ID,
          # no PKG link, no installation claim.
          public_retail = {
              "schema": 1,
              "source_kind": "official_retail_metadata",
              "generated_at_utc": generated,
              "is_fpkg_update_catalog": False,
              "fpkg_compatibility_confirmed": False,
              "downloads_enabled": False,
              "install_enabled": False,
              "titles": [
                  {
                      "cusa": item["cusa"],
                      "status": item["status"],
                      **({"latest_retail_version": item["latest_retail_version"]}
                         if item.get("latest_retail_version") else {}),
                  }
                  for item in raw["titles"]
              ],
          }
          public_inventory = {
              "schema": 4,
              "source": "historical_public_summary_not_live_console",
              "metadata_only": True,
              "public_summary_only": True,
              "games": [
                  {"cusa": cusa, "name": name, "app_ver": ver}
                  for cusa, name, ver in snapshot
              ],
