# Retired from active FPKG-only product. Historical retail lookup scripts
# remain in the repository solely for reproducibility and comparisons.
# This branch MUST NOT scrape Sony/Retail patch metadata on a schedule,
# publish public snapshots, or push arbitrary generated files to main.
name: Legacy Retail Metadata Report (Retired — FPKG Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-notice:
    name: Historical report retired; no discovery or publication
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Explain discontinued scope
        run: |
          echo 'FPKG-only project: historical Retail report is disabled.'
          echo 'No network catalogs, no PKG download or install, no branch writes.'
          echo 'Do not use Retail metadata as evidence of FPKG compatibility.'
