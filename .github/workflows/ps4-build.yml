
name: PS4 Native Scanner Build (Experimental)

on:
  workflow_dispatch:
  push:
    paths:
      - "ps4-auto-updater-v0.3/**"
      - ".github/workflows/ps4-build.yml"

permissions:
  contents: read

# One toolchain download per branch; avoid saturating release-asset CDN.
concurrency:
  group: ps4-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: PC Simulation Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Arabic bitmap build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-noto-core

      - name: Run all automatic tests
        env:
          UI_PREVIEW_EXPORT_DIR: ps4-auto-updater-v0.3/ui-previews
        run: |
          python3 -m unittest discover \
            -s ps4-auto-updater-v0.3/tests \
            -p 'test_*.py' \
            -v

      - name: Upload host-rendered UI previews (NOT PS4 screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-native-host-previews
          path: ps4-auto-updater-v0.3/ui-previews/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Host checks completed
        run: |
          echo "All host tests passed."
          echo "Real PS4 compatibility still needs console testing."

  ps4-scanner:
    name: Build PS4 Package
    runs-on: ubuntu-22.04
    needs:
      - host-tests
    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            make \
            curl \
            ca-certificates \
            python3 \
            python3-pil \
            fonts-noto-core \
            libicu-dev

      - name: Restore verified OpenOrbis archive from CI cache
        uses: actions/cache@v4
        with:
          path: /tmp/openorbis.tar.gz
          key: openorbis-v0.5.4-sha256-3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526

      - name: Download and verify OpenOrbis Toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526'
          ASSET='/tmp/openorbis.tar.gz'
          # Even cached archives are checked before execution.
          if ! echo "$EXPECTED  $ASSET" | sha256sum --check --status; then
            rm -f "$ASSET"
            # Try the public release URL first; API asset negotiation is an
            # alternative origin when GitHub's release CDN returns HTTP 504.
            if ! curl -fL --retry 3 --retry-all-errors --retry-delay 5 \
               --connect-timeout 20 --max-time 300 \
               'https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz' \
               -o "$ASSET"; then
              rm -f "$ASSET"
              curl -fL --retry 3 --retry-all-errors --retry-delay 5 \
                --connect-timeout 20 --max-time 300 \
                -H 'Accept: application/octet-stream' \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                'https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/assets/356303789' \
                -o "$ASSET"
            fi
          fi
          # SHA-256 published by the official OpenOrbis release (v0.5.4).
          echo "$EXPECTED  $ASSET" | sha256sum --check

          mkdir -p "$RUNNER_TEMP/openorbis"

          tar -xzf /tmp/openorbis.tar.gz \
            -C "$RUNNER_TEMP/openorbis"

          SDK_LINK=$(find "$RUNNER_TEMP/openorbis" \
            -name link.x -type f -print -quit)

          test -n "$SDK_LINK"

          SDK_ROOT=$(dirname "$SDK_LINK")
          echo "OO_PS4_TOOLCHAIN=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Compile PS4 Package
        run: |
          make -C ps4-auto-updater-v0.3/ps4

      - name: Verify PS4 package header and publish SHA256
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          target = Path("ps4-auto-updater-v0.3/ps4")
          files = list(target.glob("*.pkg"))
          assert len(files) == 1, f"Expected exactly one PKG, found {len(files)}"
          pkg = files[0]
          with pkg.open("rb") as handle:
              header = handle.read(0x1000)

          assert len(header) == 0x1000, "Truncated PKG header"
          assert header[:4] == b"\x7fCNT", "Wrong PS4 PKG magic"
          expected_id = "IV0000-BREW00197_00-PS4SCANNERTEST00"
          actual_id = header[0x40:0x64].split(b"\x00", 1)[0].decode("ascii")
          assert actual_id == expected_id, (
              f"Wrong PKG Content ID: {actual_id!r}"
          )
          assert pkg.stat().st_size >= 1024 * 1024, "PKG suspiciously small"

          digest = hashlib.sha256()
          with pkg.open("rb") as handle:
              for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(chunk)

          manifest = (
              "PS4 Scanner experimental — NOT tested on console\n"
              "Build version: 01.14\n"
              f"Filename: {pkg.name}\n"
              f"Content ID: {actual_id}\n"
              f"Size bytes: {pkg.stat().st_size}\n"
              f"SHA256: {digest.hexdigest()}\n"
          )
          (target / "BUILD_MANIFEST.txt").write_text(manifest)
          print(manifest)
          PY

      # Targeted emulator-only ZIP on this draft development branch:
      # produce the SAME assembled app files as the successful native build,
      # but do not release/upload the PS4-installable .pkg from this branch.
      # shadPS4's core accepts a direct eboot.bin path even if the Qt game
      # discovery UI does not support this BREW title ID.
      - name: Stage read-only shadPS4 extracted app
        if: github.ref == 'refs/heads/fix/scanner-cid-and-inventory-capacity'
        shell: bash
        run: |
          set -euo pipefail
          APP='ps4-auto-updater-v0.3/ps4'
          TARGET="${RUNNER_TEMP}/shadps4-smoke/BREW00197"
          mkdir -p "$TARGET/sce_sys/about" "$TARGET/sce_module"
          install -m 0644 "$APP/eboot.bin" "$TARGET/eboot.bin"
          install -m 0644 "$APP/sce_sys/param.sfo" "$TARGET/sce_sys/param.sfo"
          install -m 0644 "$APP/sce_sys/icon0.png" "$TARGET/sce_sys/icon0.png"
          install -m 0644 "$APP/sce_sys/about/right.sprx" "$TARGET/sce_sys/about/right.sprx"
          install -m 0644 "$APP/sce_module/libc.prx" "$TARGET/sce_module/libc.prx"
          install -m 0644 "$APP/sce_module/libSceFios2.prx" "$TARGET/sce_module/libSceFios2.prx"
          install -m 0644 'ps4-auto-updater-v0.3/SHADPS4_SMOKE_TEST_AR.md' \
            "${RUNNER_TEMP}/shadps4-smoke/README_AR.md"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "shadps4-smoke"
          target = root / "BREW00197"
          required = [
              "eboot.bin",
              "sce_sys/param.sfo",
              "sce_sys/icon0.png",
              "sce_sys/about/right.sprx",
              "sce_module/libc.prx",
              "sce_module/libSceFios2.prx",
          ]
          for rel in required:
              path = target / rel
              assert path.is_file() and path.stat().st_size > 0, f"missing {rel}"
          assert (target / "eboot.bin").read_bytes()[:4] != b"", "empty eboot"
          expected_pkg = list(Path("ps4-auto-updater-v0.3/ps4").glob("*.pkg"))
          assert len(expected_pkg) == 1, "this app must match the validated single-PKG build"
          meta = "\n".join([
              "shadPS4 extracted-app smoke fixture ONLY",
              "COMMIT: " + os.environ["GITHUB_SHA"],
              "BUILD: OpenOrbis, read-only scanner UI",
              "APP ID: BREW00197",
              "PKG: intentionally NOT included; draft release gate remains closed",
              "RUN: shadPS4 /absolute/path/to/BREW00197/eboot.bin",
              "EXPECTED: UI/input only; localhost GoldHEN FTP and installed games absent",
              "UNKNOWN: shadPS4 support for this app; NOT tested on physical PS4",
              "",
          ]) + "\n"
          (root / "SMOKE_MANIFEST.txt").write_text(meta, encoding="utf-8")
          (root / "EBoot_SHA256.txt").write_text(
              hashlib.sha256((target / "eboot.bin").read_bytes()).hexdigest()
              + "  BREW00197/eboot.bin\n",
              encoding="utf-8",
          )
          print(meta)
          PY

      - name: Upload shadPS4-only smoke artifact (NOT PKG release)
        if: github.ref == 'refs/heads/fix/scanner-cid-and-inventory-capacity'
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-readonly-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/shadps4-smoke/
          if-no-files-found: error
          retention-days: 7

      - name: Upload PS4 Package
        # Do not distribute unverified test packages from draft feature branches.
        # A green CI only proves host tests/build, not PS4 firmware support.
        if: github.ref == 'refs/heads/main' && vars.ENABLE_PS4_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ps4-scanner-experimental
          path: |
            ps4-auto-updater-v0.3/ps4/*.pkg
            ps4-auto-updater-v0.3/ps4/BUILD_MANIFEST.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease with direct PKG download
        if: github.ref == 'refs/heads/main' && vars.ENABLE_PS4_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Publish only a fully tested build from the current main HEAD.
          HEAD_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated run at $GITHUB_SHA; main is $HEAD_SHA"
            exit 0
          fi

          TAG="scanner-v0.6.5"
          ASSET="PS4-Auto-Updater-v0.6.5.pkg"
          ROOT="ps4-auto-updater-v0.3/ps4"
          PKG="$ROOT/IV0000-BREW00197_00-PS4SCANNERTEST00.pkg"
          MANIFEST="$ROOT/BUILD_MANIFEST.txt"
          test -s "$PKG" && test -s "$MANIFEST"
          cp "$PKG" "$ASSET"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving immutable artifact."
            exit 0
          fi

          gh release create "$TAG" "$ASSET" "$MANIFEST" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "PS4 Auto Updater v0.6.5 — SystemService shell exit fix (experimental)" \
            --notes "READ-ONLY experimental build (PKG 01.14). v0.6.4 real PS4 diagnostic reached APP_MAIN_RETURNING 0 before CE-34878-0. v0.6.5 requests shell termination using SystemService to avoid musl _exit; logs at /data/PS4AutoUpdater/diagnostic_v065.txt. Firmware 14.00 hardware exit retest pending. No updates downloaded or installed."

          echo "Direct PKG: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
