name: FPKG Publisher Metadata Review (Offline)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fpkg-source-audit.yml"
      - "ps4-auto-updater-v0.3/fpkg_publisher_sources.py"
      - "ps4-auto-updater-v0.3/update_source_registry.py"
      - "ps4-auto-updater-v0.3/catalog_ingest.py"
      - "ps4-auto-updater-v0.3/tests/test_fpkg_publisher_sources.py"
      - "ps4-auto-updater-v0.3/source_registry/reviewed_publishers.json"

permissions:
  contents: read

jobs:
  review:
    name: Validate separately reviewed FPKG publisher references
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source records
        uses: actions/checkout@v4

      - name: Run no-network source policy tests
        run: |
          python3 -m unittest discover \
            -s ps4-auto-updater-v0.3/tests \
            -p 'test_fpkg_publisher_sources.py' -v

      - name: Check local registry without fetching any packages or catalogs
        working-directory: ps4-auto-updater-v0.3
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from fpkg_publisher_sources import _policy, review_publisher_origins
          from catalog_ingest import ingest

          registry = json.loads(
              Path("source_registry/reviewed_publishers.json").read_text(
                  encoding="utf-8"
              )
          )
          audited = _policy(registry)
          empty_catalog = ingest({"schema": 1, "submissions": []})
          assert review_publisher_origins(empty_catalog, registry) == {}
          print("Publisher references recorded:", len(audited))
          print("No external requests. No PKG downloads or rights granted.")
          PY
